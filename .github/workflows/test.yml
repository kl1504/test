on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  

jobs:
  test:
    runs-on: ubuntu-24.04

  steps:
  - name: Checkout code
    uses: actions/checkout@v6
  - name: Install test environment
      uses: actions/setup-node@v6.0.1
      with:
        node-version: '20' 

    - name: Validate the HTML syntax
      run: npx htmlhint "**/*.html"

    - name: Validate the JavaScript syntax
      run: |
        # Correction : Syntaxe d'analyse native correcte avec find et node
        find . -name "*.js" -not -path "*/node_modules/*" -exec node --check {} \;


  build:
    runs-on: ubuntu-24.04
    needs: test

    steps:
    - name: Récupérer le code du projet
      uses: actions/checkout@v6.0.1

    - name: Con- name: Configurer Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construire l'image Docker
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false 
        tags: mon-site-html:latest
