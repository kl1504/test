on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install test environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Validate the HTML syntax
        run: npx htmlhint "**/*.html"

      - name: Validate the JavaScript syntax
        run: find . -name "*.js" -not -path "*/node_modules/*" -exec node --check {} \;

  build:
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construire l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mon-site-html:latest

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Télécharger l'image Docker archivée
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      # 1. ÉTAPE CLÉ : Récupérer l'IP publique réelle attribuée au runner par GitHub
      - name: Récupérer l'IP Publique du Runner
        id: public_ip
        run: |
          RUNNER_IP=$(curl -s https://ipify.org)
          echo "L'adresse IP publique de ce runner est : $RUNNER_IP"
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Charger l'image Docker
        run: docker load --input /tmp/mon-site-html.tar

      # 2. On démarre le conteneur en le liant à TOUTES les interfaces (0.0.0.0)
      - name: Déployer et démarrer le conteneur
        run: |
          docker run -d \
          -p 0.0.0.0:8080:80 \
          --name conteneur-site \
          mon-site-html:latest

      # 3. On teste via l'adresse IP publique globale et le port
      - name: Valider l'accès via l'IP Publique et le Port
        run: |
          sleep 3
          echo "Requête sur l'IP externe du runner..."
          curl -v http://${{ steps.public_ip.outputs.ip }}:8080


